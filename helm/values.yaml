image:
  repository: registry.gitlab.com/cryptophobic/mlops-train-automation/digits-inference
  tag: "seed-1781360169"
  pullPolicy: IfNotPresent

# Pull secret для приватного GitLab Container Registry. Створюється
# одноразово до того, як ArgoCD виконає перший sync:
#
#   kubectl -n inference create secret docker-registry gitlab-registry \
#     --docker-server=registry.gitlab.com \
#     --docker-username=<deploy-token-user> \
#     --docker-password=<deploy-token>
#
# Якщо registry публічний — заміни на `imagePullSecrets: []`.
imagePullSecrets:
  - name: gitlab-registry

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

mlflow:
  trackingUri: http://mlflow.mlflow.svc.cluster.local:5000
  s3EndpointUrl: http://minio.mlflow.svc.cluster.local:9000
  awsAccessKeyId: mlflow
  awsSecretAccessKey: mlflow-secret-key
  awsRegion: us-east-1

model:
  name: digits-classifier
  stage: Production

drift:
  threshold: "3.0"

serviceMonitor:
  enabled: true
  interval: 15s
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"