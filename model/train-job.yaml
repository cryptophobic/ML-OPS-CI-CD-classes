# Kubernetes Job, що його GitLab CI застосовує до кластера для retrain-у.
# CI підставляє `__IMAGE__` через envsubst/sed на актуальний tag з registry,
# напр. `registry.gitlab.com/<user>/<proj>/digits-inference:abc1234-1781234567`.
#
#   sed "s|__IMAGE__|${IMAGE}|g" model/train-job.yaml | kubectl apply -f -
#
# Job сам реєструє нову версію моделі у MLflow Model Registry та
# перемикає її на стадію Production. Інференс-под після rolling restart
# (тригериться bump-ом image-tag у helm/values.yaml) підхопить її.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: digits-train-
  namespace: inference
  labels:
    app.kubernetes.io/name: digits-train
    app.kubernetes.io/component: trainer
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digits-train
        app.kubernetes.io/component: trainer
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: __IMAGE__
          imagePullPolicy: Always
          command: ["python", "-m", "model.train"]
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio.mlflow.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              value: mlflow
            - name: AWS_SECRET_ACCESS_KEY
              value: mlflow-secret-key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: MODEL_NAME
              value: digits-classifier
            - name: PROMOTE_STAGE
              value: Production
            - name: PUSHGATEWAY_URL
              value: http://prometheus-pushgateway.monitoring.svc.cluster.local:9091
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi